name: Build REAPER Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.13
      with:
        cmake-version: '3.25.0'
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload Windows Plugin
      uses: actions/upload-artifact@v4
      with:
        name: reaper_enz_ReaperTools-win64
        path: build/Release/reaper_enz_ReaperTools.dll

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.13
      with:
        cmake-version: '3.25.0'
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload macOS Plugin
      uses: actions/upload-artifact@v4
      with:
        name: reaper_enz_ReaperTools-macos
        path: build/reaper_enz_ReaperTools.dylib

  build-ucs-backend:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: python -m pip install -r ucs_tool/backend/requirements-build.txt

    - name: Build UCS backend exe
      run: >
        pyinstaller
        --onefile
        --name enz_ucs_service
        --add-data "ucs_tool/backend/data;data"
        ucs_tool/backend/ucs_service.py

    - name: Upload UCS Backend
      uses: actions/upload-artifact@v4
      with:
        name: enz_ucs_service-win64
        path: dist/enz_ucs_service.exe

  create-release:
    needs: [build-windows, build-macos, build-ucs-backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
    
    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        fi
    
    - name: Download Windows Plugin
      uses: actions/download-artifact@v4
      with:
        name: reaper_enz_ReaperTools-win64
        path: dist/
    
    - name: Download macOS Plugin
      uses: actions/download-artifact@v4
      with:
        name: reaper_enz_ReaperTools-macos
        path: dist/

    - name: Download UCS Backend
      uses: actions/download-artifact@v4
      with:
        name: enz_ucs_service-win64
        path: dist/
    
    - name: Create Tag (if not exists)
      run: |
        git fetch --tags
        # 检查本地和远程是否都存在该标签
        if ! git rev-parse ${{ steps.version.outputs.version }} >/dev/null 2>&1 && ! git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.version }}$"; then
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
        else
          echo "Tag ${{ steps.version.outputs.version }} already exists locally or remotely, skipping tag creation."
        fi
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/reaper_enz_ReaperTools.dll
          dist/reaper_enz_ReaperTools.dylib
          dist/enz_ucs_service.exe
        generate_release_notes: true
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Update ReaPack Index
      run: python .github/scripts/update_reapack_index.py

  push-to-publish-repo:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: 获取版本号
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: 下载 Windows DLL
        uses: actions/download-artifact@v4
        with:
          name: reaper_enz_ReaperTools-win64
          path: .

      - name: 下载 macOS dylib
        uses: actions/download-artifact@v4
        with:
          name: reaper_enz_ReaperTools-macos
          path: .

      - name: 下载 UCS 后端
        uses: actions/download-artifact@v4
        with:
          name: enz_ucs_service-win64
          path: .

      - name: 克隆发布库
        uses: actions/checkout@v4
        with:
          repository: signorzhao/reapack_repo
          path: publish_repo
          persist-credentials: false

      - name: 复制 DLL 到发布库
        run: |
          mkdir -p publish_repo/releases/${{ steps.get_version.outputs.version }}
          cp reaper_enz_ReaperTools.dll publish_repo/releases/${{ steps.get_version.outputs.version }}/

      - name: 复制 macOS dylib 到发布库
        run: |
          cp reaper_enz_ReaperTools.dylib publish_repo/releases/${{ steps.get_version.outputs.version }}/

      - name: 复制 UCS 工具到发布库
        run: |
          mkdir -p publish_repo/releases/${{ steps.get_version.outputs.version }}/ucs
          cp enz_ucs_service.exe publish_repo/releases/${{ steps.get_version.outputs.version }}/ucs/
          cp ucs_tool/scripts/enz_UCS_Auto_Rename_Selected_Items.lua publish_repo/releases/${{ steps.get_version.outputs.version }}/ucs/
          cp ucs_tool/scripts/start_ucs_service_windows.bat publish_repo/releases/${{ steps.get_version.outputs.version }}/ucs/
          cp .github/scripts/update_publish_index.py publish_repo/update_index.py
          cd publish_repo
          python update_index.py

      - name: 列出发布库目录
        run: ls -l publish_repo/releases

      - name: 列出新版本目录内容
        run: ls -l publish_repo/releases/${{ steps.get_version.outputs.version }}

      - name: 验证 token
        run: |
          if [ -z "${{ secrets.PUBLISH_TOKEN }}" ]; then
            echo "Error: PUBLISH_TOKEN secret is empty"
            exit 1
          fi
          REAPACK_TOKEN="${{ secrets.PUBLISH_TOKEN }}"
          echo "Token is set (length: ${#REAPACK_TOKEN})"

      - name: 提交并推送到发布库
        run: |
          cd publish_repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # 清除可能缓存的凭据
          git config --unset --local credential.helper || true
          git config --unset --local http.https://github.com/.extraheader || true
          # 使用 token 设置远程 URL 认证
          REAPACK_TOKEN="${{ secrets.PUBLISH_TOKEN }}"
          git remote set-url origin "https://x-access-token:${REAPACK_TOKEN}@github.com/signorzhao/reapack_repo"
          git add .
          git commit -m "Auto publish ${{ steps.get_version.outputs.version }}" || echo "No changes to commit"
          git push
